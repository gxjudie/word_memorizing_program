[project]
name = "japanese-vocab-trainer-backend"
version = "0.1.0"
description = "FastAPI backend for the Japanese Vocabulary Trainer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "zstandard>=0.22",
    "python-multipart>=0.0.18",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
markers = [
    "slow: long-running tests such as the Anki import performance checks",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
# A deliberately narrow, high-signal set: real errors, unused imports/names,
# import order, and the most common bug patterns. Style-only rules are left out
# so the existing code base keeps its documented formatting.
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI's dependency-injection idiom is a call in a default argument.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The local ``alembic/`` migration directory would otherwise make the installed
# ``alembic`` package look first-party.
known-third-party = ["alembic"]

[tool.hypothesis]
# Property-based tests run a minimum of 100 examples (design requirement).
max_examples = 100
